
<svg fill="none" viewBox="0 0 800 300" width="800" height="300" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
@keyframes hi  {
            0% { transform: rotate( 0.0deg) }
           10% { transform: rotate(14.0deg) }
           20% { transform: rotate(-8.0deg) }
           30% { transform: rotate(14.0deg) }
           40% { transform: rotate(-4.0deg) }
           50% { transform: rotate(10.0deg) }
           60% { transform: rotate( 0.0deg) }
          100% { transform: rotate( 0.0deg) }
        }
                
       /* Bubble Floating Animation */
@keyframes floatUp {
  0% {
    transform: translateY(100vh) scale(0.5); /* Start below the screen */
    opacity: 0.7; /* Slightly transparent */
  }
  50% {
    transform: translateY(-50vh) scale(1.2); /* Bubbles enlarge halfway */
    opacity: 1; /* Fully opaque */
  }
  100% {
    transform: translateY(-100vh) scale(0.5); /* End above the screen */
    opacity: 0; /* Fade out */
  }

  }

.container {
  position: relative;
  width: 100%;
  height: 100%;
  pointer-events: none; /* Make sure bubbles don’t block any interactions */
}

/* Bubble Styles */
.bubble {
  position: absolute;
  width: 50px;
  height: 50px;
  background-color: rgba(255, 255, 255, 0.8); /* Slightly transparent white */
  border-radius: 50%; /* Make the bubbles round */
  animation: floatUp 5s ease-in-out infinite; /* Animate the bubbles */
  pointer-events: none; /* Bubbles should not interfere with interactions */
}

        /* Variations for different bubbles */
.bubble:nth-child(1) {
  left: 10%;
  animation-delay: 0s;
}

.bubble:nth-child(2) {
  left: 20%;
  animation-delay: 1s;
  width: 60px;
  height: 60px;
}

.bubble:nth-child(3) {
  left: 30%;
  animation-delay: 2s;
}

.bubble:nth-child(4) {
  left: 50%;
  animation-delay: 3s;
  width: 40px;
  height: 40px;
}

.bubble:nth-child(5) {
  left: 70%;
  animation-delay: 4s;
  width: 70px;
  height: 70px;
}
.hi {
          animation: hi 1.5s linear -0.5s infinite;
          display: inline-block;
          transform-origin: 70% 70%;
        }
        @keyframes gradient {
          0% {
            background-position: 0% 50%;
          }
          50% {
            background-position: 100% 50%;
          }
          100% {
            background-position: 0% 50%;
          }
        }
        .fcontainer{
          text-align: justify; 
          justify-content: center;
          align-items: center;
          color: White;
        }
        .gcontainer {
          background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
          background-size: 400% 400%;
          animation: gradient 15s ease infinite;

          width: 100%;
          height: 300px;

          display: flex;
          text-align: justify; 
          justify-content: center;
          align-items: center;
          color: black;

          font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol";
        }
@media (prefers-reduced-motion) {
          .container {
            animation: none;
          }
        .hi {
            animation: none;
          }
        }
        </style>

   <div class="fcontainer">
        <h1>Hi there !<div class="hi">👋 </div>I'm Kalyani S</h1>
     <div class="gcontainer">
<h4>I’m passionate about learning and understanding the communication of machines 📺.I enjoy working with C programming, Verilog and Scripting,  exploring how these tools enable the design and control of hardware and systems. Whether it's coding, debugging, or optimizing, I’m always excited to dive into the technical challenges and learn something new along the way.In my spare time, I keep painting and drawing.Well...🖌️🎨I am a National Artist, these creative practices are an important part of who I am.I find that the creativity involved in art provides a refreshing counterpoint to the logic-driven world of programming design🌈🧮.Both passions help me approach problems from different angles and keep me engaged in continuous growth 📈.</h4>
     </div>
   </div>
  <div class="bubble-container">
    <div class="bubble"></div>
    <div class="bubble"></div>
    <div class="bubble"></div>
    <div class="bubble"></div>
    <div class="bubble"></div>
  </div>
    </div> 
  </foreignObject>
</svg>
